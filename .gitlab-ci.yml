# composer ci is the contract: the checks are defined there, and this pipeline only wraps them.
# ADVISOR's pipeline, built from the Preflight components on this GitLab.
# Pinned to Preflight 0.9.0. Never use ~latest.
# ADVISOR requires PHP ^8.3, so the test matrix starts at 8.3.
# Docker Hub images go through the GitLab Dependency Proxy to avoid the anonymous pull limit.
include:
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/php-test@0.9.0
    inputs:
      php_versions: ["8.3", "8.4", "8.5"]
      image: "php:${PHP_VERSION}-cli-trixie"
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/composer-audit@0.9.0
  # The front page deploy layer (ADR-0017): PROCTOR checks deploy/ against CREED's policy. A failed check
  # fails the pipeline; warnings are reported and pass.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/proctor@0.9.0
    inputs:
      working_dir: deploy
      proctor_command: vendor/bin/proctor check --format=codequality
      image: "php:8.5-cli-trixie@sha256:9236fd373d3bcda0659cf94838a744bd79791419292958963f8c6b34a0071554"
  # The accessibility gate: Preflight's a11y component checks every page under site/ in a real browser
  # (axe-core, WCAG tags only, light and dark, 320 and 1280 px, reflow). Its image is on mcr.microsoft.com,
  # which the Dependency Proxy does not front, so a11y takes no image prefix.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/a11y@0.9.0
    inputs:
      site_dir: site
      pages: ["index.html", "docs/**/*.html"]
      wcag_tags: ["wcag2a", "wcag2aa", "wcag21a", "wcag21aa", "wcag22aa"]

# Dependency caching: images already come through the Dependency Proxy, and
# every job that installs packages extends a cache under a fixed key, not a
# lock-file hash (the stack's fixed-key cache decision): Composer's and npm's caches are additive, so a lock
# change downloads only what changed instead of everything.
# The cache saves even when a job fails (when: always), so a dropped download
# still keeps every package that finished, and the retry fetches only the rest.
variables:
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.cache/composer"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

.composer-cache:
  cache:
    key: composer
    paths: [.cache/composer/]
    when: always

.npm-cache:
  cache:
    key: npm
    paths: [.cache/npm/]
    when: always

wayneui-copies:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  script:
    - composer install --working-dir=deploy --no-interaction --no-progress --prefer-dist
    - deploy/vendor/bin/proctor check --path=.

composer-ci:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - composer ci

# ADVISOR's own page checks, beside Preflight's a11y component: light and dark at 390 and 1440 px, a
# reduced-motion pass, one <h1>, a lang attribute, a non-empty title, no horizontal scroll at 390 px.
a11y-extra:
  extends: .npm-cache
  image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
  script:
    - cd scripts/a11y
    - npm install --no-audit --no-fund
    - node check.mjs

# content-drift needs a schedule created in the project's CI settings by a maintainer
# (Settings, CI/CD, Schedules), and the job token needs read access to the sibling repos.
content-drift:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: always
    - when: manual
    - when: never
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - mkdir -p stack
    - |
      php -r '
        $data = json_decode(file_get_contents("data/projects.json"), true);
        foreach ($data["projects"] as $project) {
            $id = $project["id"];
            $url = "https://gitlab-ci-token:" . getenv("CI_JOB_TOKEN") . "@" . getenv("CI_SERVER_HOST") . "/" . getenv("CI_PROJECT_NAMESPACE") . "/" . $id . ".git";
            passthru("git clone --depth 1 " . escapeshellarg($url) . " " . escapeshellarg("stack/" . $id), $code);
            if ($code !== 0) {
                fwrite(STDERR, "Could not clone " . $id . "\n");
                exit(1);
            }
        }
      '
    - export ADVISOR_STACK_DIR="$CI_PROJECT_DIR/stack"
    - composer content:drift
